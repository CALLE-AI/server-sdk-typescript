name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-call-e-calle
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 8.10.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::package.json contains an invalid package version."
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "release" ]]; then
            echo "Manual workflow run: validation and npm publish dry run only."
            exit 0
          fi

          if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            echo "::error::Prereleases are not published by this stable release workflow."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The GitHub Release tag must match vX.Y.Z."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "::error::The GitHub Release tag does not match package.json version."
            exit 1
          fi

          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The checked-out commit does not match the release tag."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::The release tag commit is not contained in origin/main."
            exit 1
          fi

          if ! registry_name="$(npm view '@call-e/calle' name --registry https://registry.npmjs.org 2>/dev/null)" || [[ "$registry_name" != "@call-e/calle" ]]; then
            echo "::error::Could not confirm the package identity with the npm registry."
            exit 1
          fi

          if ! current_latest="$(npm view '@call-e/calle' dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null)"; then
            echo "::error::Could not read the current npm latest version."
            exit 1
          fi
          node scripts/require-newer-stable-version.mjs "$package_version" "$current_latest"

          set +e
          version_lookup="$(npm view "@call-e/calle@${package_version}" version --registry https://registry.npmjs.org 2>&1)"
          lookup_status=$?
          set -e
          if (( lookup_status == 0 )); then
            echo "::error::This exact package version already exists on npm."
            exit 1
          fi
          if ! grep -q '^npm error code E404$' <<< "$version_lookup"; then
            echo "::error::The npm version preflight failed without an explicit not-found response."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and pack once
        run: pnpm run validate

      - name: Identify package artifact
        id: package
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(call-e-calle-*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::Expected exactly one npm package tarball."
            exit 1
          fi

          archive_version="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));')"
          if [[ "$archive_version" != "$PACKAGE_VERSION" ]]; then
            echo "::error::The package artifact version does not match package.json."
            exit 1
          fi

          sha256sum "${tarballs[0]}" > SHA256SUMS
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=SHA256SUMS" >> "$GITHUB_OUTPUT"
          echo "artifact_name=npm-package-${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Dry run npm publish
        if: github.event_name == 'workflow_dispatch'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --tag latest --dry-run --registry https://registry.npmjs.org

      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated package
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifact

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Verify downloaded package
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -d '' artifact_files < <(find artifact -mindepth 1 -maxdepth 1 -type f -print0)
          tarballs=(artifact/*.tgz)
          if (( ${#artifact_files[@]} != 2 || ${#tarballs[@]} != 1 )) || [[ ! -f artifact/SHA256SUMS ]]; then
            echo "::error::The downloaded artifact must contain exactly one tarball and one SHA256SUMS file."
            exit 1
          fi
          if [[ "$(wc -l < artifact/SHA256SUMS)" -ne 1 ]]; then
            echo "::error::The checksum manifest must contain exactly one entry."
            exit 1
          fi
          (cd artifact && sha256sum --check --strict SHA256SUMS)

          archive_version="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));')"
          if [[ "$archive_version" != "$PACKAGE_VERSION" ]]; then
            echo "::error::The downloaded package version does not match the validated version."
            exit 1
          fi

          archive_license_expression="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).license ?? ""));')"
          if [[ "$archive_license_expression" != "MIT" ]]; then
            echo "::error::The downloaded package metadata does not declare the MIT license."
            exit 1
          fi

          archive_files="$(tar -tzf "${tarballs[0]}")"
          if ! grep -qx 'package/LICENSE' <<< "$archive_files"; then
            echo "::error::The downloaded package does not contain LICENSE."
            exit 1
          fi
          license_sha256="$(tar -xOf "${tarballs[0]}" package/LICENSE | sha256sum | cut -d ' ' -f 1)"
          if [[ "$license_sha256" != "b766911775c98c6b82f67499092da77bad1783981aef8201a50de250f4d783df" ]]; then
            echo "::error::The downloaded package LICENSE is not the approved MIT license."
            exit 1
          fi

      - name: Confirm exact version is still unpublished
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail

          if ! registry_name="$(npm view '@call-e/calle' name --registry https://registry.npmjs.org 2>/dev/null)" || [[ "$registry_name" != "@call-e/calle" ]]; then
            echo "::error::Could not confirm the package identity with the npm registry."
            exit 1
          fi

          set +e
          version_lookup="$(npm view "@call-e/calle@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org 2>&1)"
          lookup_status=$?
          set -e
          if (( lookup_status == 0 )); then
            echo "::error::This exact package version already exists on npm."
            exit 1
          fi
          if ! grep -q '^npm error code E404$' <<< "$version_lookup"; then
            echo "::error::The npm version preflight failed without an explicit not-found response."
            exit 1
          fi

      - name: Publish with npm Trusted Publishing
        id: publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(artifact/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::Expected exactly one downloaded npm package tarball."
            exit 1
          fi

          npm publish "${tarballs[0]}" --access public --tag latest --registry https://registry.npmjs.org

      - name: Verify published package metadata
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            visible_version="$(npm view "@call-e/calle@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            latest_version="$(npm view '@call-e/calle' dist-tags.latest 2>/dev/null || true)"
            if [[ "$visible_version" == "$PACKAGE_VERSION" && "$latest_version" == "$PACKAGE_VERSION" ]]; then
              exit 0
            fi
            echo "Published package metadata is not visible yet; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::Post-publish metadata verification failed. The publish step already succeeded; do not assume the package is unpublished or retry the same version."
          exit 1

      - name: Smoke test published package install
        if: always() && steps.publish.outcome == 'success'
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          npm init -y >/dev/null

          for attempt in {1..10}; do
            if npm install --ignore-scripts --no-audit --no-fund "@call-e/calle@${PACKAGE_VERSION}"; then
              if node --input-type=module -e 'import { CalleClient } from "@call-e/calle"; const client = new CalleClient({ apiKey: "smoke" }); if (typeof client.goals.runAndWait !== "function") process.exit(1);' && ./node_modules/.bin/calle --help | grep "Usage:" >/dev/null; then
                exit 0
              fi

              echo "::error::The published package failed its install smoke test. The package was already published; do not retry publication with the same version."
              exit 1
            fi
            echo "Published package install is not available yet; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::Post-publish install verification timed out. The publish step already succeeded; do not assume the package is unpublished or retry the same version."
          exit 1
