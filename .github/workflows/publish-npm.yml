name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish.
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      auth:
        description: Release identity to use.
        required: true
        default: token
        type: choice
        options:
          - token
          - trusted-publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.10.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck examples
        run: pnpm run typecheck:examples

      - name: Validate package build
        run: pnpm run test:package

      - name: Check package tarball
        run: pnpm run pack:check

      - name: Publish with npm token
        if: inputs.auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret NPM_TOKEN."
            exit 1
          fi

          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --access public --tag "${{ inputs.tag }}" --registry https://registry.npmjs.org

      - name: Publish with npm Trusted Publishing
        if: inputs.auth == 'trusted-publishing'
        run: npm publish --access public --tag "${{ inputs.tag }}" --registry https://registry.npmjs.org

      - name: Verify published package
        run: npm view @calle-ai/calle dist-tags version

      - name: Smoke test published package install
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "@calle-ai/calle@${{ inputs.tag }}"
          node --input-type=module -e 'import { CalleClient } from "@calle-ai/calle"; if (typeof CalleClient !== "function") process.exit(1);'
